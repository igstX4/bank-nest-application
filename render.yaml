services:
  - type: web
    name: bank-backend
    env: node
    rootDir: backend-nest
    buildCommand: npm install --legacy-peer-deps --include=dev && npm run prisma:generate && npm run build
    startCommand: npm run start:migrate:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bank-database
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: bank-database
    databaseName: bankapp

